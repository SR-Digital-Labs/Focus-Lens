[package]
name = "focuslens"
version = "0.1.0"
description = "Privacy-first desktop productivity assistant"
authors = ["FocusLens"]
edition = "2021"

[lib]
name = "focuslens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
