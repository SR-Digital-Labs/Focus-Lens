
name: Build FocusLens Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cv/requirements.txt

      - name: Download MediaPipe models
        run: |
          python cv/models/download_model.py
          python cv/models/download_pose_model.py

      - name: Install Node dependencies
        run: npm ci

      - name: Fix Tauri notification version
        run: npm install @tauri-apps/plugin-notification@2.8.0 --save-exact

      - name: Update Tauri Rust dependency
        working-directory: src-tauri
        run: cargo update -p tauri --precise 2.12.3

      - name: Build Windows Desktop App
        run: npm run tauri:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FocusLens-Windows
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
