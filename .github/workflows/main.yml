name: Build FocusLens Windows App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Test and package Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cv/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies and test tools
        run: python -m pip install -r cv/requirements.txt pytest

      - name: Run frontend tests, lint, and production build
        run: |
          npm test
          npm run lint
          npm run build

      - name: Run CV tests
        working-directory: cv
        run: python -m pytest tests

      - name: Download MediaPipe models for packaging
        run: |
          python cv/models/download_model.py
          python cv/models/download_pose_model.py

      - name: Build Windows installers
        run: npm run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: FocusLens-Windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
